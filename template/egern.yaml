---
ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false
vif_only: false
dns:
  bootstrap:
    - system
  upstreams:
    public:
      - https://223.5.5.5/dns-query
      - https://1.1.1.1/dns-query
  forward:
    - wildcard:
        match: "*"
        value: public
proxies: []
policy_groups:
  - select:
      name: Proxy
      policies:
        - DIRECT
  - auto_test:
      name: Auto
      policies: []
      interval: 600
      tolerance: 100
      timeout: 5
rules:
  - geoip:
      match: CN
      policy: DIRECT
  - default:
      policy: Proxy
