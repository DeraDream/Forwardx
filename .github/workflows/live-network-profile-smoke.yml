name: Live Network Profile Smoke

on:
  push:
    branches:
      - smoke-network-profile-85-149-212-98

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test IPQuality-compatible sources and BGP.Tools
        shell: bash
        run: |
          set -u
          IP="85.149.212.98"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36"
          echo "=== IP: $IP ==="

          for DB in ipapi ip2location abuseipdb scamalytics ipqualityscore; do
            echo
            echo "=== check.place db=$DB ==="
            OUT="/tmp/$DB.json"
            CODE=$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 20 -o "$OUT" -w "%{http_code}" "https://ipinfo.check.place/$IP?db=$DB" || true)
            echo "HTTP=$CODE bytes=$(wc -c < "$OUT" 2>/dev/null || echo 0)"
            python3 - "$DB" "$OUT" <<'PY'
          import json,sys,os
          db,path=sys.argv[1],sys.argv[2]
          try:
              data=json.load(open(path))
          except Exception as e:
              print("JSON_ERROR",repr(e))
              if os.path.exists(path):
                  print(open(path,errors="replace").read()[:300])
              raise SystemExit
          print("TOP_KEYS",sorted(data.keys())[:30])
          if db=="ipapi":
              print("asn.type=",((data.get("asn") or {}).get("type")))
              print("company.type=",((data.get("company") or {}).get("type")))
              print("company.abuser_score=",((data.get("company") or {}).get("abuser_score")))
          elif db=="ip2location":
              print("usage_type=",data.get("usage_type"))
              print("as_usage_type=",((data.get("as_info") or {}).get("as_usage_type")))
              print("fraud_score=",data.get("fraud_score"))
          elif db=="abuseipdb":
              d=data.get("data") or {}
              print("usageType=",d.get("usageType"))
              print("abuseConfidenceScore=",d.get("abuseConfidenceScore"))
          elif db=="scamalytics":
              sc=data.get("scamalytics") or {}
              print("scamalytics_score=",sc.get("scamalytics_score"))
          elif db=="ipqualityscore":
              print("fraud_score=",data.get("fraud_score"))
          PY
          done

          echo
          echo "=== RIPEstat prefix ==="
          curl -L -sS -A "$UA" --connect-timeout 10 --max-time 20             "https://stat.ripe.net/data/network-info/data.json?resource=$IP" -o /tmp/ripe.json
          PREFIX=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ripe.json'))
          print((d.get('data') or {}).get('prefix') or '')
          PY
          )
          echo "PREFIX=$PREFIX"

          echo
          echo "=== BGP.Tools prefix page ==="
          PAGE_CODE=$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 20             -o /tmp/bgp-page.html -w "%{http_code}" "https://bgp.tools/prefix/$PREFIX" || true)
          echo "HTTP=$PAGE_CODE bytes=$(wc -c < /tmp/bgp-page.html 2>/dev/null || echo 0)"

          PATHKEY=$(printf "%s" "$PREFIX" | sed 's#/#_#')
          UUID=$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          BGP_URL="https://bgp.tools/pathimg/rt-$PATHKEY?$UUID&loggedin"
          echo
          echo "=== BGP.Tools pathimg ==="
          echo "$BGP_URL"
          BGP_CODE=$(curl -L -sS -A "$UA" -H "Referer: https://bgp.tools/"             --connect-timeout 10 --max-time 25 -D /tmp/bgp.headers             -o /tmp/bgp.img -w "%{http_code}" "$BGP_URL" || true)
          echo "HTTP=$BGP_CODE bytes=$(wc -c < /tmp/bgp.img 2>/dev/null || echo 0)"
          grep -i '^content-type:' /tmp/bgp.headers | tail -1 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/bgp.img')
          b=p.read_bytes() if p.exists() else b''
          print("HEAD",repr(b[:120]))
          text=b.decode('utf-8','ignore')
          print("HAS_SVG", "<svg" in text[:4096].lower())
          print("PLACEHOLDER", "Not_Visible" in text and "in_DFZ" in text)
          PY
