name: Release iptables-only Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'iptables-only-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < agent/IPTABLES_ONLY_VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "iptables-only-v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match iptables-only-v$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test and build standalone Agent
        run: |
          (cd agent && go test -tags iptablesonly ./... && go vet -tags iptablesonly ./...)
          bash scripts/test-forwardx-iptables-menu.sh
          bash scripts/build-agent-iptables-only.sh
          (cd dist/agent && sha256sum -c "iptables-only-v${VERSION}-SHA256SUMS")
      - name: Publish separate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="iptables-only-v${VERSION}"
          gh release create "$tag" \
            "dist/agent/forwardx-agent-iptables-only-v${VERSION}-linux-amd64.tar.gz" \
            "dist/agent/forwardx-agent-iptables-only-v${VERSION}-linux-arm64.tar.gz" \
            "dist/agent/iptables-only-v${VERSION}-SHA256SUMS" \
            --title "iptables-only Agent v${VERSION}" \
            --notes "Separate offline Agent package. Does not update the panel or the standard Agent."
