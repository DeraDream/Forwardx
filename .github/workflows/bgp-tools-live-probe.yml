name: Network Profile Live Probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/bgp-tools-live-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Run Agent BGP helper against 155.103.50.0/24
        shell: bash
        run: |
          cat > agent/network_profile_live_bgp_test.go <<'EOF'
          package main

          import (
            "fmt"
            "strings"
            "testing"
            "time"
          )

          func TestLiveBGPGraphDataURL(t *testing.T) {
            client := profileHTTPClient("ipv4", 20*time.Second)
            got, err := profileBGPToolsGraphDataURL(client, "155.103.50.0/24", "/pathimg/rt-155.103.50.0_24")
            if err != nil {
              t.Fatal(err)
            }
            fmt.Printf("BGP_DATA_URL_LEN=%d PREFIX_OK=%v\n", len(got), strings.HasPrefix(got, "data:image/svg+xml;base64,"))
            if !strings.HasPrefix(got, "data:image/svg+xml;base64,") || len(got) < 1000 {
              t.Fatalf("invalid BGP data URL")
            }
          }
          EOF
          (cd agent && go test -run TestLiveBGPGraphDataURL -v)
          rm -f agent/network_profile_live_bgp_test.go
