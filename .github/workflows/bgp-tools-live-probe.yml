name: Network Profile Live Probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/bgp-tools-live-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 155.103.50.67 providers
        shell: bash
        run: |
          set -u
          IP="155.103.50.67"
          PREFIX="155.103.50.0/24"
          echo "===== FFraud ====="
          curl -L --compressed -sS -m 20 "https://api.ffraud.com/public/ip/$IP" | jq '{fraud_score,risk,connection_type,hosting,company,geo}'
          echo "===== IP99 ====="
          curl -L --compressed -sS -m 20 "https://ip99.com/v1/ip/$IP" | jq .
          echo "===== IP2Location JSON ====="
          curl -L --compressed -sS -m 20 "https://api.ip2location.io/?ip=$IP&format=json" | jq .
          echo "===== ProxyCheck ====="
          curl -L --compressed -sS -m 20 "https://proxycheck.io/v2/$IP?vpn=1&asn=1&risk=1&days=7" | jq .
          echo "===== BGP SVG ====="
          tmp="$(mktemp)"
          code="$(curl -L --compressed -sS -m 20 -o "$tmp" -w '%{http_code}' -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36" -H "Accept: image/svg+xml,image/*;q=0.9,*/*;q=0.2" -e "https://bgp.tools/prefix/$PREFIX" "https://bgp.tools/pathimg/rt-155.103.50.0_24" || true)"
          echo "HTTP=$code SIZE=$(wc -c < "$tmp" | tr -d ' ') SVG=$(grep -a -m1 -o '<svg' "$tmp" || true)"
          rm -f "$tmp"
