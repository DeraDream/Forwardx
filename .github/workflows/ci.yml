name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions and types
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit

      - name: Verify Agent encryption
        run: node --import tsx --test server/agentCrypto.test.ts

      - name: Run panel tests
        run: pnpm test:server

      - name: Verify subscription backup integration
        shell: bash
        run: |
          set +e
          GIN_MODE=release FORWARDX_SUBLINK_INTEGRATION=1 node --import tsx --test server/sublinkBackup.integration.test.ts 2>&1 | tee /tmp/sublink-integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details="$(tail -c 6000 /tmp/sublink-integration.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Subscription backup integration failed::$details"
            exit "$status"
          fi

      - name: Build panel and documentation
        run: |
          pnpm build
          pnpm docs:build

      - name: Verify Agent and FXP
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)
