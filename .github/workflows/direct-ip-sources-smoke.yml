name: Direct IP Sources Smoke
on:
  push:
    branches:
      - smoke-direct-ip-sources-85-149-212-98
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct sources
        shell: bash
        run: |
          set -u
          IP="85.149.212.98"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36"
          testurl () {
            NAME="$1"; URL="$2"; OUT="/tmp/$NAME.out"
            echo "=== $NAME ==="
            CODE=$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 20 -D "/tmp/$NAME.h" -o "$OUT" -w "%{http_code}" "$URL" || true)
            echo "HTTP=$CODE bytes=$(wc -c < "$OUT" 2>/dev/null || echo 0)"
            grep -i '^content-type:' "/tmp/$NAME.h" | tail -1 || true
            python3 - "$OUT" <<'PY'
          import sys, pathlib
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes() if p.exists() else b''
          print(repr(b[:1000]))
          PY
          }
          testurl ipapi "https://api.ipapi.is/?q=$IP"
          testurl ip2location "https://api.ip2location.io/?ip=$IP"
          testurl abusepage "https://www.abuseipdb.com/check/$IP"
          testurl abuseapi "https://api.abuseipdb.com/api/v2/check?ipAddress=$IP&maxAgeInDays=90"
          testurl ip2demo "https://www.ip2location.com/demo/$IP"
          testurl ipapiweb "https://ipapi.is/?q=$IP"
          echo "=== grep ip2demo ==="
          grep -ioE '.{0,120}(Usage Type|Fraud Score|Proxy Type|ASN|Data Center|Hosting).{0,180}' /tmp/ip2demo.out | head -40 || true
          echo "=== grep ipapiweb ==="
          grep -ioE '.{0,120}(abuser_score|company[^<]{0,80}type|asn[^<]{0,80}type|is_datacenter|fraud|hosting).{0,180}' /tmp/ipapiweb.out | head -60 || true
          echo "=== query-specific ipapiweb ==="
          grep -ioE '.{0,160}(85\.149\.212\.98|BAGE CLOUD|AS63150).{0,260}' /tmp/ipapiweb.out | head -30 || true
