name: Live Fallback Provider Smoke

on:
  push:
    branches:
      - smoke-network-profile-85-149-212-98

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test fallback providers
        shell: bash
        run: |
          set -u
          IP="85.149.212.98"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36"

          for NAME in ffraud ip99; do
            case "$NAME" in
              ffraud) URL="https://api.ffraud.com/public/ip/$IP" ;;
              ip99) URL="https://ip99.com/v1/ip/$IP" ;;
            esac
            echo "=== $NAME ==="
            curl -L -sS -A "$UA" --connect-timeout 10 --max-time 20               -D "/tmp/$NAME.h" -o "/tmp/$NAME.json" -w "HTTP=%{http_code}\n" "$URL" || true
            grep -i '^content-type:' "/tmp/$NAME.h" | tail -1 || true
            python3 - "$NAME" <<'PY'
          import json,sys
          name=sys.argv[1]
          p=f"/tmp/{name}.json"
          try:
              d=json.load(open(p))
              print(json.dumps(d,ensure_ascii=False,indent=2)[:5000])
          except Exception as e:
              print("ERR",e)
              print(open(p,errors="replace").read()[:1000])
          PY
          done
