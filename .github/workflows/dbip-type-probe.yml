name: DB-IP Type Probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/dbip-type-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DB-IP demo usageType
        shell: bash
        run: |
          set -eu
          IP="85.149.212.98"
          tmp="$(mktemp)"
          curl -fsSL --compressed -A 'Mozilla/5.0 Chrome/154 Safari/537.36' -H 'Accept: application/json,text/plain,*/*' -e 'https://db-ip.com/' "https://db-ip.com/demo/home.php?s=$IP" -o "$tmp"
          echo "===== RAW ====="
          head -c 6000 "$tmp"
          echo
          echo "===== KEYS ====="
          jq 'keys' "$tmp"
          jq '.demoInfo // .data // .info // .' "$tmp" | head -c 6000
