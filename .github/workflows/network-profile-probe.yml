name: Network Profile Provider Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/network-profile-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'probe network profile providers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Probe live fallback chain
        shell: bash
        run: |
          cat > agent/network_profile_live_probe_test.go <<'EOF'
          package main

          import (
            "fmt"
            "testing"
            "time"
          )

          func TestLiveProviderFallbackChain(t *testing.T) {
            client := profileHTTPClient("ipv4", 20*time.Second)
            ip := "85.149.212.98"
            ffraud := profileFFraudFallbackSource(client, ip)
            ip99 := profileIP99FallbackSource(client, ip)
            emptyProxyCheck := profileRiskSource{Name: "ProxyCheck"}

            names := []string{"ipapi", "Scamalytics", "IPQS", "AbuseIPDB"}
            for _, name := range names {
              target := profileRiskSource{Name: name, Error: "simulated check.place HTTP 403"}
              profileApplySharedRiskFallbacks(&target, ffraud, ip99, emptyProxyCheck)
              fmt.Printf("MERGED_ROW name=%s score=%v level=%s country=%s network=%q company=%q fallback=%q error=%q\n",
                target.Name, target.Score, target.Level, target.Country, target.NetworkType, target.CompanyType, target.FallbackProvider, target.Error)
              if target.Score == nil {
                t.Fatalf("%s still has no score after fallback", name)
              }
            }

            ip2 := profileRiskSource{Name: "IP2Location", Error: "simulated check.place HTTP 403"}
            demo := profileIP2LocationDemoSource(client, ip)
            if profileRiskSourceHasUsefulData(demo) {
              profileMergeRiskSourceFallback(&ip2, demo, "IP2Location Demo")
            }
            profileApplySharedRiskFallbacks(&ip2, ffraud, ip99, emptyProxyCheck)
            fmt.Printf("MERGED_ROW name=%s score=%v level=%s country=%s network=%q company=%q fallback=%q error=%q\n",
              ip2.Name, ip2.Score, ip2.Level, ip2.Country, ip2.NetworkType, ip2.CompanyType, ip2.FallbackProvider, ip2.Error)
            if ip2.Score == nil || ip2.NetworkType == "" || ip2.CompanyType == "" {
              t.Fatalf("IP2Location fallback incomplete: %+v", ip2)
            }
          }
          EOF
          (cd agent && go test -run TestLiveProviderFallbackChain -v)
          rm -f agent/network_profile_live_probe_test.go
