name: Network Profile Provider Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/network-profile-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'probe network profile providers')
    runs-on: ubuntu-latest
    steps:
      - name: Probe provider endpoints
        shell: bash
        run: |
          set -u
          IP="85.149.212.98"
          probe() {
            local name="$1"
            local url="$2"
            echo
            echo "===== $name ====="
            tmp="$(mktemp)"
            code="$(curl -L --compressed -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36' -H 'Accept: application/json,text/plain,text/html,*/*' -sS -m 20 -o "$tmp" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            echo "TYPE=$(file -b --mime-type "$tmp" 2>/dev/null || true)"
            echo "SIZE=$(wc -c < "$tmp" | tr -d ' ')"
            head -c 1200 "$tmp" | tr '\n' ' '
            echo
            rm -f "$tmp"
          }
          probe "check.place ipapi" "https://ipinfo.check.place/$IP?db=ipapi"
          probe "check.place AbuseIPDB" "https://ipinfo.check.place/$IP?db=abuseipdb"
          probe "check.place IP2Location" "https://ipinfo.check.place/$IP?db=ip2location"
          probe "ipapi.is" "https://api.ipapi.is/?q=$IP"
          probe "IP2Location.io" "https://api.ip2location.io/?ip=$IP"
          probe "IP2Location demo" "https://www.ip2location.com/demo/$IP"
          probe "FFraud" "https://api.ffraud.com/public/ip/$IP"
          probe "IP99" "https://ip99.com/v1/ip/$IP"
          probe "IPinfo demo" "https://ipinfo.io/widget/demo/$IP"
