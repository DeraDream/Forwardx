name: Network Profile Provider Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/network-profile-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'probe network profile providers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Probe live fallback parsers
        shell: bash
        run: |
          cat > agent/network_profile_live_probe_test.go <<'EOF'
          package main

          import (
            "fmt"
            "testing"
            "time"
          )

          func TestLiveProviderFallbacks(t *testing.T) {
            client := profileHTTPClient("ipv4", 20*time.Second)
            ip := "85.149.212.98"
            sources := []profileRiskSource{
              profileIPAPIDirectSource(client, ip),
              profileIP2LocationDemoSource(client, ip),
              profileIP2LocationDirectSource(client, ip),
              profileFFraudFallbackSource(client, ip),
              profileIP99FallbackSource(client, ip),
            }
            for _, source := range sources {
              fmt.Printf("LIVE_SOURCE name=%s score=%v level=%s country=%s network=%q company=%q proxy=%v vpn=%v tor=%v dc=%v abuser=%v bot=%v error=%q\n",
                source.Name, source.Score, source.Level, source.Country, source.NetworkType, source.CompanyType,
                source.IsProxy, source.IsVPN, source.IsTor, source.IsDatacenter, source.IsAbuser, source.IsBot, source.Error)
            }
          }
          EOF
          (cd agent && go test -run TestLiveProviderFallbacks -v)
          rm -f agent/network_profile_live_probe_test.go
